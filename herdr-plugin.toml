# herdr-openclaw —— 让 herdr 把 OpenClaw TUI 面板当一等公民 agent 纳管。
#
# 契约来源：herdr plugin link 校验器的实际回显 + 本仓库
# docs/findings-2026-08-12.md。字段一律以 `herdr plugin link` 的回显为准，
# 不照抄文档 —— 上次照抄的结果是 manifest 从未被加载过。
id = "herdr-openclaw"
name = "OpenClaw for Herdr"
version = "0.1.0"
description = "Reports OpenClaw TUI panes to herdr as first-class agents."
# 别往这里加 homepage / license 之类字段：实测 `herdr plugin link` 会**静默丢弃**
# 不在 schema 内的键（回显里根本没有它们），留着只会让人以为它们生效了。
# pane.report_agent / release-agent / report-metadata 全套在 0.8.0 的 CLI 上验证过。
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

# 只做对账 + 把 watcher 甩到后台，必须立刻返回。
[[startup]]
command = ["node", "bin/startup.mjs"]

[[actions]]
id = "watch-status"
title = "OpenClaw: watcher 状态"
contexts = ["workspace"]
command = ["node", "bin/status.mjs"]

[[actions]]
id = "watch-restart"
title = "OpenClaw: 重启 watcher"
contexts = ["workspace"]
command = ["node", "bin/startup.mjs"]
